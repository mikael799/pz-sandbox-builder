<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PZ Sandbox Builder</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#ddd9d0;--accent:#2f6f4e;--warn:#a15c00;--bad:#b3261e;--over:#6a3fb5;--chg:#fff4cc}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#212226;--ink:#e8e6e1;--mute:#9a978f;--line:#34353a;--accent:#6cc497;--warn:#e0a24a;--bad:#ef7a72;--over:#b79af0;--chg:#3a3420}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}*::-webkit-scrollbar-track{background:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI Variable Text','Segoe UI Variable','Segoe UI',system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.small{font-size:12px;padding:0 8px;margin-left:6px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input[type=number]{width:120px}
textarea,pre{font:12.5px/1.6 'Cascadia Code','Cascadia Mono',Consolas,monospace}
textarea{width:100%}
pre{margin:0;white-space:pre}
.wrap{display:grid;grid-template-columns:210px minmax(0,1fr) 420px;height:100vh}
aside{padding:20px 14px;overflow:auto}
aside input{width:100%;margin-bottom:14px;padding:7px 10px;border-radius:8px}
aside label.only{display:flex;gap:8px;align-items:center;margin:-4px 0 12px 4px;font-size:14px;color:var(--mute);cursor:pointer}
aside label.only input{width:auto;margin:0}
#tabs button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;margin-bottom:2px}
#tabs button:hover{background:var(--panel)}
#tabs button.on{background:var(--panel);font-weight:600;box-shadow:0 1px 2px #0001}
#tabs small{color:var(--accent);font-weight:600}
#presets{margin-top:18px}#presets select{width:100%}
.mid{overflow:auto;padding:20px 32px 100px}
.mid>*{max-width:720px;margin-left:auto;margin-right:auto}
h1{font-size:22px;font-weight:600;margin:0 auto 4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:28px auto 8px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:18px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lbl{font-weight:500}
.lbl small{display:block;color:var(--mute);font-size:12.5px;font-weight:400;line-height:1.45;margin-top:2px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row.changed{background:var(--chg)}
.row.follower{padding-left:38px;background:linear-gradient(90deg,transparent 22px,var(--accent) 22px,var(--accent) 24px,transparent 24px)}
.row.follower.changed{background:linear-gradient(90deg,transparent 22px,var(--accent) 22px,var(--accent) 24px,var(--chg) 24px)}
.row.inactive{opacity:.45}
.row.bad input,.row.bad select{border-color:var(--bad);color:var(--bad)}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid currentColor;margin-left:6px;font-weight:400;white-space:nowrap}
.tag.over{color:var(--over)}.tag.link{color:var(--accent)}.tag.mis{color:var(--warn)}.tag.off{color:var(--mute)}
.out{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.head{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px}.btns .primary{flex:1;padding:8px}.btns input{width:120px}
summary{cursor:pointer;color:var(--mute)}
.msg{padding:8px 12px;border-radius:6px;border:1px solid}
.msg.error{color:var(--bad)}.msg.warn{color:var(--warn)}.msg.info{color:var(--mute);border-color:var(--line)}
.msg button{margin:6px 6px 0 0}
.code{flex:1;overflow:auto;padding:12px 16px;color:var(--mute)}
.code .hl{color:var(--ink);background:var(--chg);display:inline-block;min-width:100%}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.out{border:0}.mid{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <input id="q" type="search" placeholder="Search settings">
    <label class="only"><input type="checkbox" id="only"> Only changed settings</label>
    <div id="tabs"></div>
    <div id="presets"></div>
  </aside>
  <main class="mid" id="mid"></main>
  <section class="out">
    <div class="head">
      <div class="btns"><button class="primary" id="copy">Copy file</button><input id="name" value="servertest" title="Server name, used for the download file name"><button id="dl">Download</button></div>
      <details><summary>Paste existing file</summary><textarea id="paste" rows="8" placeholder="SandboxVars = { ... }"></textarea><button id="load" style="margin-top:6px">Load</button></details>
      <div id="msgs"></div>
    </div>
    <div class="code"><pre id="code"></pre></div>
  </section>
</div>

<script id="core">
const OPTS = SCHEMA.options, BY = Object.fromEntries(OPTS.map(o => [o.key, o]));

const MAXINT = 2147483647;

// Linked groups. rows: [driver value, [[lo, hi] per follower]]. lo === hi is a fixed number, else a random day.
const fixed = (...xs) => xs.map(x => [x, x]);
const shut = lo => [[1, fixed(-1)], ...[30, 60, 180, 360, 1800].map((hi, i) => [i + 2, [[lo, hi]]]), [7, [[60, 180]]], [8, [[180, 360]]], [9, fixed(MAXINT)]];

const rowOf = d => LINKS[d].rows.find(r => r[0] === S.vals[d]);

const roll = ([lo, hi]) => lo === hi ? lo : lo + Math.floor(Math.random() * (hi - lo + 1));
const fits = (d, row) => LINKS[d].followers.every((f, i) => inRange(S.vals[f], row[1][i]));

const bad = k => { const o = BY[k], v = S.vals[k]; return o.min !== undefined && (v < o.min || v > o.max); };

function mismatch(d) {

}
function applyDriver(d, force) {
  const row = rowOf(d);
  if (row) LINKS[d].followers.forEach((f, i) => { if (force || !S.over.has(f)) { S.vals[f] = roll(row[1][i]); S.over.delete(f); } });

function setValue(k, v) {

  if (!d) return;
  const group = LINKS[d].followers;
  const row = rowOf(d) && fits(d, rowOf(d)) ? rowOf(d) : LINKS[d].rows.find(r => fits(d, r));
  if (row) { S.vals[d] = row[0]; group.forEach(f => S.over.delete(f)); } else S.over.add(k);

// Number of known values a preset would change, then the preset itself.
const presetDiff = name => OPTS.filter(o => S.vals[o.key] !== o.presets[name]).length;

// ---- Lua reader: a subset that covers sandbox files and preset files ----

function loadText(src) {

  else if (ver.value.value < SCHEMA.sandboxVersion) throw new LoadError(`This file is VERSION ${ver.value.value}. The page reads VERSION 6 only. Start the server once with this file, so that the server writes an upgraded file, then paste that file.`);
  else if (ver.value.value > SCHEMA.sandboxVersion) msgs.push(['warn', `This file is VERSION ${ver.value.value}, newer than this page (6). Unknown keys pass through unchanged. The output says VERSION = 6.`]);

  if (o.type === 'string') return JSON.stringify(v);

}

  const out = [['SandboxVars = {', null], ['    VERSION = 6,', null]];
  const put = (o, ind) => {
    if (o.tooltip) {
      out.push([`${ind}-- ${o.tooltip.replace(/\\n/g, ' ')}`, null]);

      if (o.type === 'enum' && o.enum.some((l, i) => l !== String(i + 1))) o.enum.forEach((l, i) => out.push([`${ind}-- ${i + 1} = ${l}`, null]));

    return `<select ${at}>${opts.join('')}</select>`;
  }
  const combo = o.advancedCombo?.length ? `<select data-combo="${esc(k)}"><option value="">Custom</option>${o.advancedCombo.map(([l, x]) =>
    `<option value="${x}" ${Number(x) === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>` : '';
  return `${combo}<input type="number" ${at} step="${o.type === 'double' ? 'any' : 1}" min="${o.min}" max="${o.max}" value="${v}">`;
}
function tags(k) {
  const t = [], L = LINKS[k];
  if (L) t.push(mismatch(k) ? '<span class="tag mis">numbers differ</span>' : `<span class="tag link">sets ${L.followers.length}</span>`);
  if (L?.reroll) {
    t.push(`<button class="small" data-reroll="${k}" title="Pick a new random day in this range">re-roll</button>`);
    if (pastDay(k) !== null) t.push(`<span class="tag mis">day ${pastDay(k)} is already past at start</span>`);
  }
  if (S.over.has(k)) t.push(`<span class="tag over">override</span><button class="small" data-reset="${esc(k)}">reset</button>`);
  else if (DRIVER_OF[k]) t.push(`<span class="tag link">from ${esc(BY[DRIVER_OF[k]].label)}</span>`);
  if (gateOff(k)) t.push(`<span class="tag off">ignored: ${GATES[k][1]}</span>`);
  return t.join('');
}
// The game's comment for a setting, without color codes. The input already enforces Min and Max.
const hint = o => (o.tooltip ?? '').split('\\n').map(s => s.replace(/<[^>]*>/g, '').replace(/^Min: \S+ Max: \S+ (Default: .*)$/, '$1').trim()).filter(Boolean).join(' ');
const row = (o, cls = '') => `<div class="row ${cls} ${changed(o.key) ? 'changed' : ''} ${gateOff(o.key) ? 'inactive' : ''} ${bad(o.key) ? 'bad' : ''}">
  <div class="lbl" title="${esc(o.key)}">${esc(o.label)}${tags(o.key)}${hint(o) ? `<small>${esc(hint(o))}</small>` : ''}</div><div class="ctl">${control(o)}</div></div>`;
// Rows in list order, with each driver's followers pulled up right under it.
function rows(list) {
  const here = new Set(list.map(o => o.key));
  return list.filter(o => !here.has(DRIVER_OF[o.key])).map(o =>
    row(o) + (LINKS[o.key]?.followers.map(f => row(BY[f], 'follower')).join('') ?? '')).join('');
}
// One dropdown for a card where 3+ settings share the same named levels (Loot rarity).
// One control for a card where 3+ settings share the same named levels (Loot rarity), or for all XP multipliers.
function setAll(part) {
  const groups = Object.groupBy(part.filter(o => o.advancedCombo?.length), o => JSON.stringify(o.advancedCombo));
  const [combo, list] = Object.entries(groups).sort((a, b) => b[1].length - a[1].length)[0] ?? [];
  const xp = part[0].section === 'XP multipliers' ? part.filter(o => o.type === 'double') : [];
  const use = list?.length >= 3 ? list : xp;
  if (use.length < 3) return '';
  const vals = new Set(use.map(o => S.vals[o.key])), one = vals.size === 1 ? [...vals][0] : null;
  const at = `data-setall="${esc(use.map(o => o.key).join(' '))}"`;
  const ctl = use === list
    ? `<select ${at}><option value="">${one === null ? 'Mixed' : 'Custom'}</option>${JSON.parse(combo).map(([l, x]) => `<option value="${x}" ${Number(x) === one ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
    : `<input type="number" ${at} step="any" min="${use[0].min}" max="${use[0].max}" value="${one ?? ''}" placeholder="Mixed">`;
  // Same row and pills as a driver: "sets N", or "values differ" while the settings disagree.
  const tag = one === null ? '<span class="tag mis">values differ</span>' : `<span class="tag link">sets ${use.length}</span>`;
  return `<div class="row"><div class="lbl">All ${esc(part[0].section.toLowerCase().replace('xp', 'XP'))}${tag}</div><div class="ctl">${ctl}</div></div>`;
}
function middle() {
  const q = $('q').value.trim().toLowerCase(), only = $('only').checked;
  const show = o => !only || changed(o.key);
  if (q) {
    const hits = OPTS.filter(o => show(o) && (o.label + ' ' + o.key).toLowerCase().includes(q));
    return `<h1>Search: ${esc(q)}</h1>` + (hits.length ? `<div class="panel">${rows(hits)}</div>` : '<p>No setting matches.</p>');
  }
  const list = OPTS.filter(o => o.tab === tab).sort((a, b) => a.order - b.order);
  const sections = [...new Set(list.map(o => o.section))];
  return `<h1>${tab}</h1>` + sections.map(s => {
    // A follower renders under its driver, so its own section does not show it again.
    const part = list.filter(o => o.section === s && !(DRIVER_OF[o.key] && list.some(x => x.key === DRIVER_OF[o.key])));
    const shown = part.filter(show);
    return shown.length ? (s ? `<h2>${esc(s)}</h2>` : '') + `<div class="panel">${setAll(part)}${rows(shown)}</div>` : '';
  }).join('') || '<p>No changed settings in this tab.</p>';
}

function render() {
  const a = document.activeElement, focusKey = a?.dataset?.k ?? a?.dataset?.combo, focusAttr = a?.dataset?.k ? 'k' : 'combo';
  const q = $('q').value.trim();
  $('tabs').innerHTML = SCHEMA.tabs.map(t => `<button data-tab="${t}" class="${!q && t === tab ? 'on' : ''}">${t}<small>${OPTS.filter(o => o.tab === t && changed(o.key)).length || ''}</small></button>`).join('');
  $('presets').innerHTML = `<select id="preset"><option value="">Load a preset...</option>${SCHEMA.presets.map(p => `<option value="${p}">${p}${p === 'Apocalypse' ? ' (game default)' : ''}</option>`).join('')}</select>`
    + (pendingPreset ? `<div class="msg warn" style="margin-top:8px">Replace ${presetDiff(pendingPreset)} changes?<br><button class="primary" id="presetYes">Replace</button><button id="presetNo">Cancel</button></div>` : '');
  $('mid').innerHTML = middle();
  $('msgs').innerHTML = msgs.map(([k, t]) => `<div class="msg ${k}">${esc(t)}</div>`).join('');
  $('code').innerHTML = writeLines().map(([l, k]) => k && changed(k) ? `<span class="hl">${esc(l)}</span>` : esc(l)).join('\n');
  if (focusKey) document.querySelector(`[data-${focusAttr}="${CSS.escape(focusKey)}"]`)?.focus();
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ file: write(), over: [...S.over] })); } catch {}
}
function edited() { save(); setTimeout(render); }
function load(src, okMsgs) {
  try { msgs = okMsgs ?? loadText(src); pendingPreset = null; save(); render(); return true; }
  catch (e) { if (!(e instanceof LoadError)) throw e; msgs = [['error', e.message + ' Nothing was loaded.']]; render(); return false; }
}

document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.k;
  if (t.id === 'preset' && t.value) {
    if (presetDiff(t.value)) { pendingPreset = t.value; render(); }
    else { applyPreset(t.value); msgs = [['info', `Loaded the ${t.value} preset.`]]; edited(); }
  }
  if (t.id === 'only') render();
  if (t.dataset.setall && t.value !== '') {
    const keys = t.dataset.setall.split(' ');
    if (t.type === 'number' && refuse(BY[keys[0]], t, '')) return;
    keys.forEach(k => setValue(k, Number(t.value))); edited();
  }
  if (t.dataset.combo !== undefined && t.value !== '') { setValue(t.dataset.combo, Number(t.value)); edited(); }
  if (!k) return;
  const o = BY[k];
  let v = o.type === 'boolean' ? t.checked : o.type === 'string' ? t.value : Number(t.value);
  if (o.type !== 'boolean' && o.type !== 'string' && refuse(o, t, S.vals[k])) return;
  setValue(k, v); edited();
});
// Stops a typed number outside the game's range. Puts back the old value.
function refuse(o, t, old) {
  const v = Number(t.value), whole = o.type !== 'double';
  if (t.value !== '' && !isNaN(v) && v >= o.min && v <= o.max && (!whole || Number.isInteger(v))) return false;
  t.setCustomValidity(`Enter a ${whole ? 'whole number' : 'number'} from ${o.min} to ${o.max}.`); t.reportValidity();
  t.value = old; setTimeout(() => t.setCustomValidity(''), 3000);
  return true;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { tab = d.tab; $('q').value = ''; $('mid').scrollTop = 0; render(); }
  if (d.reset) { resetFollower(d.reset); edited(); }
  if (d.reroll) { reroll(d.reroll); edited(); }
  if (b.id === 'presetYes') { applyPreset(pendingPreset); msgs = [['info', `Loaded the ${pendingPreset} preset.`]]; pendingPreset = null; edited(); }
  if (b.id === 'presetNo') { pendingPreset = null; render(); }
  if (b.id === 'load' && load($('paste').value)) $('paste').value = '';
  if (b.id === 'copy') copy(b);
  if (b.id === 'dl') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([write()], { type: 'text/plain' }));
    a.download = `${$('name').value.trim() || 'servertest'}_SandboxVars.lua`; a.click(); URL.revokeObjectURL(a.href);
  }
});
async function copy(b) {
  try { await navigator.clipboard.writeText(write()); }
  catch { const t = document.createElement('textarea'); t.value = write(); document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy file', 1500);
}
$('q').addEventListener('input', render);

let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE)); } catch {}
if (saved?.file) {
  try { loadText(saved.file); S.over = new Set(saved.over); msgs = [['info', 'Restored your last session.']]; } catch { S = fresh(); }
}
render();
</script>
</body>
</html>
