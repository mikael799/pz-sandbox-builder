<!doctype html>
<!-- PROTOTYPE, throwaway. Question: what should the PZ sandbox page look like?
     Three variants on one page, switch with ?variant=A|B|C or the bottom bar (or arrow keys).
     Parser and writer are rough on purpose. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Builder Prototype</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#ddd9d0;--accent:#2f6f4e;--warn:#a15c00;--bad:#b3261e;--over:#6a3fb5;--chg:#fff4cc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181a;--panel:#212226;--ink:#e8e6e1;--mute:#9a978f;--line:#34353a;--accent:#6cc497;--warn:#e0a24a;--bad:#ef7a72;--over:#b79af0;--chg:#3a3420}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}*::-webkit-scrollbar-track{background:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI Variable Text','Segoe UI',Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input[type=number]{width:110px}
textarea{width:100%;font-family:'Cascadia Code',Consolas,ui-monospace,monospace;font-size:12.5px}
pre{margin:0;font:12.5px/1.6 'Cascadia Code',Consolas,ui-monospace,monospace;white-space:pre}
.row{display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.row .lbl small{display:block;color:var(--mute);font-size:11px}
.row.changed{background:var(--chg)}
.row.follower{margin-left:22px;border-left:3px solid var(--accent)}
.row.inactive{opacity:.45}
.row.bad input{border-color:var(--bad);color:var(--bad)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid currentColor}
.tag.over{color:var(--over)}.tag.link{color:var(--accent)}.tag.mis{color:var(--warn)}.tag.off{color:var(--mute)}
.msg{padding:8px 12px;border-radius:6px;margin:6px 0;border:1px solid}
.msg.error{color:var(--bad);border-color:var(--bad)}.msg.warn{color:var(--warn);border-color:var(--warn)}.msg.info{color:var(--mute);border-color:var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 10px 4px}
#switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:6px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 18px #0006;z-index:99;font-size:13px}
#switcher button{background:#333;color:#fff;border:0;border-radius:50%;width:28px;height:28px;padding:0}
/* A */
.A header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.A nav{display:flex;gap:2px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.A nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px}
.A nav button.on{border-bottom-color:var(--accent);font-weight:600}
.A main{max-width:900px;margin:12px auto 80px;padding:0 16px}
.A dialog{width:min(900px,95vw);border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
/* B */
.B .wrap{display:grid;grid-template-columns:200px minmax(0,1fr) 400px;height:100vh}
.B aside{padding:20px 14px;overflow:auto}
.B aside button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;margin-bottom:2px}
.B aside button:hover{background:var(--panel)}
.B aside button.on{background:var(--panel);font-weight:600;box-shadow:0 1px 2px #0001}
.B aside small{color:var(--accent);font-weight:600}
.B .mid{overflow:auto;padding:20px 32px 100px}
.B .mid > *{max-width:720px;margin-left:auto;margin-right:auto}
.B .mid h1{font-size:22px;font-weight:600;margin:0 auto 4px}
.B .mid h2{margin-top:28px;margin-bottom:8px}
.B .mid .panel{border-radius:12px}
.B .row{padding:12px 18px;gap:18px}
.B .row:last-child{border-bottom:0}
.B .row .lbl{font-weight:500}.B .row .lbl small{display:none}
.B .row.follower{margin-left:0;padding-left:38px;border-left:0;background:linear-gradient(90deg,transparent 22px,var(--accent) 22px,var(--accent) 24px,transparent 24px)}
.B .row.follower.changed{background:linear-gradient(90deg,transparent 22px,var(--accent) 22px,var(--accent) 24px,var(--chg) 24px)}
.B .tag{margin-left:6px;font-weight:400}
.B .out{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.B .out .head{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.B .out .btns{display:flex;gap:8px}.B .out .btns .primary{flex:1;padding:8px}
.B .out .code{flex:1;overflow:auto;padding:12px 16px}
.B .code span{color:var(--mute)}.B .code .hl{color:var(--ink);background:var(--chg);border-radius:3px}
.B .code .hl{background:var(--chg);display:block}
@media (max-width:900px){.B .wrap{grid-template-columns:1fr;height:auto}.B aside,.B .out{border:0}}
/* C */
.C main{max-width:820px;margin:0 auto;padding:16px 16px 90px}
.C .step{margin:14px 0;padding:12px}
.C .step h3{margin:0 0 8px;font-size:15px}
.C details{border-top:1px solid var(--line)}.C summary{padding:8px 10px;cursor:pointer;font-weight:600}
.C .chain{border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
</style>
</head>

const OPTS = SCHEMA.options, BY = Object.fromEntries(OPTS.map(o => [o.key, o]));
const TABLES = ['Basement', 'Map', 'ZombieLore', 'ZombieConfig', 'MultiplierConfig'];

// Links: game tables only (see issue 03).
const POP = { 'ZombieConfig.PopulationMultiplier': [2.5, 1.6, 1.2, 0.65, 0.15, 0], 'ZombieConfig.PopulationStartMultiplier': [4, 2, 1.5, 1, 0.5, 0], 'ZombieConfig.PopulationPeakMultiplier': [4, 2, 1.5, 1.5, 0.5, 0] };
const RESP = { 'ZombieConfig.RespawnHours': [16, 72, 216, 0], 'ZombieConfig.RespawnUnseenHours': [6, 16, 48, 0], 'ZombieConfig.RespawnMultiplier': [0.5, 0.1, 0.05, 0] };
const SHUT = [[-1, -1], [0, 30], [0, 60], [0, 180], [0, 360], [0, 1800], [60, 180], [180, 360], [2147483647, 2147483647]];
const roll = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const LINKS = {
  Zombies: { followers: Object.keys(POP), set: v => Object.fromEntries(Object.entries(POP).map(([k, t]) => [k, t[v - 1]])) },
  ZombieRespawn: { followers: Object.keys(RESP), set: v => Object.fromEntries(Object.entries(RESP).map(([k, t]) => [k, t[v - 1]])) },
  ZombieMigrate: { followers: ['ZombieConfig.RedistributeHours'], set: v => ({ 'ZombieConfig.RedistributeHours': v ? 12 : 0 }) },
  WaterShut: { followers: ['WaterShutModifier'], reroll: true, set: v => ({ WaterShutModifier: roll(...SHUT[v - 1]) }) },
  ElecShut: { followers: ['ElecShutModifier'], reroll: true, set: v => { const [lo, hi] = SHUT[v - 1]; return { ElecShutModifier: v >= 2 && v <= 6 ? roll(14, hi) : roll(lo, hi) }; } },
};
const DRIVER_OF = {}; for (const [d, l] of Object.entries(LINKS)) l.followers.forEach(f => DRIVER_OF[f] = d);
const GATES = { 'ZombieLore.SprinterPercentage': ['ZombieLore.Speed', v => v === 4, 'Speed is not Random'], 'ZombieLore.DoorOpeningPercentage': ['ZombieLore.Cognition', v => v === 4, 'Cognition is not Random'], SeenHoursPreventLootRespawn: ['HoursForLootRespawn', v => v > 0, 'loot respawn is off'], MaxItemsForLootRespawn: ['HoursForLootRespawn', v => v > 0, 'loot respawn is off'], ConstructionPreventsLootRespawn: ['HoursForLootRespawn', v => v > 0, 'loot respawn is off'] };

// State
let S = { vals: {}, over: new Set(), unknown: [], msgs: [], tab: 'Zombie', q: '' };
function reset(src) { S.vals = Object.fromEntries(OPTS.map(o => [o.key, src ? o.presets?.[src] ?? o.default : o.default])); S.over = new Set(); S.unknown = []; S.msgs = [{ k: 'info', t: src ? `Started from preset ${src}.` : 'Started from game defaults.' }]; }
reset();
const changed = k => JSON.stringify(S.vals[k]) !== JSON.stringify(BY[k].default);
const bad = k => { const o = BY[k], v = S.vals[k]; return typeof v === 'number' && o.min != null && (v < o.min || v > o.max); };
const gateOff = k => GATES[k] && !GATES[k][1](S.vals[GATES[k][0]]);
function mismatch(d) { const l = LINKS[d]; if (!l || l.reroll) return false; const want = l.set(S.vals[d]); return l.followers.some(f => !S.over.has(f) && Number(S.vals[f]) !== Number(want[f])); }
function setVal(k, v) {
  S.vals[k] = v;
  if (LINKS[k]) { const w = LINKS[k].set(v); for (const f in w) if (!S.over.has(f)) S.vals[f] = w[f]; }
  if (DRIVER_OF[k]) { // follower edit: reverse lookup or override
    const d = DRIVER_OF[k], l = LINKS[d], n = BY[d].type === 'boolean' ? [false, true] : Array.from({ length: BY[d].max }, (_, i) => i + 1);
    const hit = l.reroll ? null : n.find(x => l.followers.every(f => Number(l.set(x)[f]) === Number(f === k ? v : S.vals[f])));
    if (hit !== undefined && hit !== null) { S.vals[d] = hit; l.followers.forEach(f => S.over.delete(f)); } else S.over.add(k);
  }
  render();
}
function resetOver(k) { S.over.delete(k); const d = DRIVER_OF[k]; Object.assign(S.vals, { [k]: LINKS[d].set(S.vals[d])[k] }); render(); }
function reroll(d) { const w = LINKS[d].set(S.vals[d]); for (const f in w) { S.over.delete(f); S.vals[f] = w[f]; } render(); }

// Rough parser: tracks nested tables, reads key = value lines.
function parse(text) {
  const vals = {}, unknown = []; let path = [], ver = null, n = 0, cur = null;
  for (const raw of text.split(/\r?\n/)) { n++;
    const line = raw.replace(/--.*$/, '').trim(); if (!line) continue;
    if (cur) { cur.text += '\n' + raw; cur.depth += (line.match(/{/g) || []).length - (line.match(/}/g) || []).length; if (cur.depth <= 0) { unknown.push(cur); cur = null; } continue; }
    let m;
    if (/^(SandboxVars\s*=|return)\s*{$/.test(line)) { path = ['']; continue; }
    if ((m = line.match(/^(\w+)\s*=\s*{$/))) { if (path.length === 1 && TABLES.includes(m[1])) { path.push(m[1]); continue; } cur = { key: [...path.slice(1), m[1]].join('.'), text: raw, depth: 1, table: true }; continue; }
    if (/^},?$/.test(line)) { path.pop(); continue; }
    if ((m = line.match(/^(\w+)\s*=\s*(.+?),?$/))) {
      const key = [...path.slice(1), m[1]].join('.'); let v = m[2];
      v = v === 'true' ? true : v === 'false' ? false : /^-?[\d.]+$/.test(v) ? Number(v) : /^".*"$/.test(v) ? v.slice(1, -1) : NaN;
      if (Number.isNaN(v)) throw new Error(`Line ${n}: cannot read value "${m[2]}"`);
      if (/^version$/i.test(key)) ver = v; else if (BY[key]) vals[key] = v; else unknown.push({ key, text: raw });
      continue;
    }
    throw new Error(`Line ${n}: cannot read "${line.slice(0, 40)}"`);
  }
  return { vals, unknown, ver };
}
function load(text) {
  let r; try { r = parse(text); } catch (e) { S.msgs = [{ k: 'error', t: e.message + '. Nothing was loaded.' }]; render(); return; }
  if (r.ver !== null && r.ver < 6) { S.msgs = [{ k: 'error', t: `This file is VERSION ${r.ver}. Start your server once with it so the game upgrades it, then paste the new file.` }]; render(); return; }
  const missing = OPTS.filter(o => !(o.key in r.vals)).length;
  S.vals = Object.fromEntries(OPTS.map(o => [o.key, o.key in r.vals ? r.vals[o.key] : o.default])); S.over = new Set(); S.unknown = r.unknown;
  S.msgs = [{ k: 'info', t: `Loaded ${OPTS.length - missing} settings.` }];
  if (missing) S.msgs.push({ k: 'info', t: `${missing} settings were missing and were filled from defaults.` });
  if (r.ver > 6) S.msgs.push({ k: 'warn', t: `VERSION ${r.ver} is newer than this page (6). Unknown keys pass through.` });
  if (r.unknown.length) S.msgs.push({ k: 'info', t: `${r.unknown.length} unknown keys (mods?) will pass through unchanged.` });
  const nb = OPTS.filter(o => bad(o.key)).length; if (nb) S.msgs.push({ k: 'warn', t: `${nb} values are out of range (marked red).` });
  const mis = Object.keys(LINKS).filter(mismatch); if (mis.length) S.msgs.push({ k: 'warn', t: `Label and numbers disagree for: ${mis.join(', ')}. Nothing changes until you touch them.` });
  render();
}
// Rough writer (real one generates game comments; see issue 04).
function fmt(o, v) { return o.type === 'double' ? (Number.isInteger(v) ? v.toFixed(1) : String(v)) : o.type === 'string' ? `"${v}"` : String(v); }
function write() {
  const L = ['SandboxVars = {', '    VERSION = 6,'];
  const top = OPTS.filter(o => !o.key.includes('.'));
  for (const o of top) L.push(`    ${o.key} = ${fmt(o, S.vals[o.key])},`);
  S.unknown.filter(u => !u.key.includes('.') && !u.table).forEach(u => L.push(u.text));
  for (const t of TABLES) { L.push(`    ${t} = {`); OPTS.filter(o => o.key.startsWith(t + '.')).forEach(o => L.push(`        ${o.key.split('.')[1]} = ${fmt(o, S.vals[o.key])},`)); S.unknown.filter(u => u.key.startsWith(t + '.')).forEach(u => L.push(u.text)); L.push('    },'); }
  S.unknown.filter(u => u.table && !u.key.includes('.')).forEach(u => L.push(u.text));
  L.push('}'); return L.join('\r\n');
}
const copy = () => navigator.clipboard.writeText(write()).then(() => { S.msgs = [{ k: 'info', t: 'Copied the complete file.' }]; render(); });
const download = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([write()])); a.download = 'servertest_SandboxVars.lua'; a.click(); };

// Shared pieces (controls only; layouts differ per variant)
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function control(o) {
  const v = S.vals[o.key], id = `data-k="${o.key}"`;
  if (o.type === 'boolean') return `<input type="checkbox" ${id} ${v ? 'checked' : ''}>`;
  if (o.type === 'enum') return `<select ${id}>${o.enum.map((l, i) => `<option value="${i + 1}" ${v === i + 1 ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  if (o.type === 'string') return `<input ${id} value="${esc(v)}">`;
  const combo = o.advancedCombo?.length ? `<select data-combo="${o.key}"><option>Custom</option>${o.advancedCombo.map(([l, x]) => `<option value="${x}" ${Number(x) === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>` : '';
  return `${combo}<input type="number" step="${o.type === 'double' ? 'any' : 1}" ${o.max < 1e9 ? `min="${o.min}" max="${o.max}"` : ''} ${id} value="${v}">`;
}
function tags(k) {
  const t = [];
  if (LINKS[k]) t.push(`<span class="tag ${mismatch(k) ? 'mis' : 'link'}">${mismatch(k) ? 'numbers differ' : 'sets ' + LINKS[k].followers.length}</span>`);
  if (LINKS[k]?.reroll) t.push(`<button data-reroll="${k}" title="Pick a new random day">re-roll</button>`);
  if (S.over.has(k)) t.push(`<span class="tag over">override</span><button data-reset="${k}">reset</button>`);
  else if (DRIVER_OF[k]) t.push(`<span class="tag link">from ${BY[DRIVER_OF[k]].label}</span>`);
  if (gateOff(k)) t.push(`<span class="tag off">ignored: ${GATES[k][2]}</span>`);
  if (LINKS[k]?.reroll) { const f = LINKS[k].followers[0], d = S.vals[f], past = (S.vals.TimeSinceApo - 1) * 30; if (d >= 0 && d <= past) t.push(`<span class="tag mis">day ${d} is already past at start</span>`); }
  return t.join(' ');
}
function row(o, cls = '') {
  const k = o.key;
  return `<div class="row ${cls} ${changed(k) ? 'changed' : ''} ${gateOff(k) ? 'inactive' : ''} ${bad(k) ? 'bad' : ''}"><div class="lbl" title="${esc(k)}">${esc(o.label)} ${tags(k)}<small>${esc(k)}</small></div><div class="ctl">${control(o)}</div></div>`;
}
// Driver then its followers indented right under it.
function rowsWithFollowers(list) {
  const seen = new Set(), out = [];
  for (const o of list) { if (seen.has(o.key) || (DRIVER_OF[o.key] && list.some(x => x.key === DRIVER_OF[o.key]))) continue; out.push(row(o)); seen.add(o.key);
    if (LINKS[o.key]) LINKS[o.key].followers.forEach(f => { out.push(row(BY[f], 'follower')); seen.add(f); }); }
  return out.join('');
}
const inTab = t => OPTS.filter(o => o.tab === t).sort((a, b) => a.order - b.order);
const search = q => OPTS.filter(o => (o.label + ' ' + o.key).toLowerCase().includes(q.toLowerCase()));
const msgs = () => S.msgs.map(m => `<div class="msg ${m.k}">${esc(m.t)}</div>`).join('');
const presetSel = () => `<select data-preset><option value="">Start from...</option><option value="__def">Game defaults</option>${SCHEMA.presets.map(p => `<option>${p}</option>`).join('')}</select>`;
function grouped(tab) { const list = inTab(tab), secs = [...new Set(list.map(o => o.section))]; return secs.map(s => (s ? `<h2>${esc(s)}</h2>` : '') + `<div class="panel">${rowsWithFollowers(list.filter(o => o.section === s))}</div>`).join(''); }

// Variant A: in-game style tabs, paste and output in a dialog
function A() {
  return `<div class="A"><header><strong>PZ Sandbox Builder</strong>${presetSel()}<button data-open="paste">Paste file</button><input placeholder="Search settings" data-q value="${esc(S.q)}" style="flex:1;min-width:140px"><button class="primary" data-act="copy">Copy file</button><button data-act="dl">Download</button></header>
  <nav>${SCHEMA.tabs.map(t => `<button data-tab="${t}" class="${!S.q && S.tab === t ? 'on' : ''}">${t}</button>`).join('')}</nav>
  <main>${msgs()}${S.q ? `<div class="panel">${rowsWithFollowers(search(S.q))}</div>` : grouped(S.tab)}</main>
  <dialog id="paste"><p>Paste your <code>*_SandboxVars.lua</code></p><textarea rows="18" id="pastebox"></textarea><p><button class="primary" data-act="load">Load</button> <button data-close>Cancel</button></p></dialog></div>`;
}
// Variant B: three panes, live output always visible with changed lines highlighted
function B() {
  const changedKeys = new Set(OPTS.filter(o => changed(o.key)).map(o => o.key.split('.').pop()));
  const code = write().split('\r\n').map(l => { const m = l.match(/^\s*(\w+) =/); return `<span class="${m && changedKeys.has(m[1]) ? 'hl' : ''}">${esc(l)}</span>`; }).join('\n');
  return `<div class="B"><div class="wrap"><aside><input placeholder="Search settings" data-q value="${esc(S.q)}" style="width:100%;margin-bottom:14px;padding:7px 10px;border-radius:8px">${SCHEMA.tabs.map(t => `<button data-tab="${t}" class="${!S.q && S.tab === t ? 'on' : ''}">${t} <small>${inTab(t).filter(o => changed(o.key)).length || ''}</small></button>`).join('')}<div style="margin-top:18px">${presetSel()}</div></aside>
  <div class="mid">${S.q ? `<h1>Search: ${esc(S.q)}</h1><div class="panel">${rowsWithFollowers(search(S.q))}</div>` : `<h1>${S.tab}</h1>` + grouped(S.tab)}</div>
  <div class="out"><div class="head"><div class="btns"><button class="primary" data-act="copy">Copy file</button><button data-act="dl">Download</button></div><details><summary>Paste existing file</summary><textarea rows="8" id="pastebox"></textarea><button data-act="load" style="margin-top:6px">Load</button></details>${msgs()}</div><div class="code"><pre>${code}</pre></div></div></div></div>`;
}
// Variant C: a guided page. 1 start, 2 what differs from default, 3 everything else, 4 output
function C() {
  const ch = OPTS.filter(o => changed(o.key));
  return `<div class="C"><main><h1 style="margin:0">PZ Sandbox Builder</h1>
  <section class="panel step"><h3>1. Start from</h3><textarea rows="5" id="pastebox" placeholder="Paste your *_SandboxVars.lua here"></textarea><p><button class="primary" data-act="load">Load pasted file</button> or ${presetSel()}</p>${msgs()}</section>
  <section class="panel step"><h3>2. Different from default (${ch.length})</h3>${ch.length ? rowsWithFollowers(ch) : '<p style="color:var(--mute)">Nothing yet.</p>'}
  <p><input placeholder="Find a setting to change" data-q value="${esc(S.q)}" style="width:100%"></p>${S.q ? rowsWithFollowers(search(S.q).slice(0, 15)) : ''}</section>
  <section class="panel step"><h3>3. All settings</h3>${SCHEMA.tabs.map(t => `<details ${S.tab === t ? 'open' : ''} data-det="${t}"><summary>${t} (${inTab(t).length})</summary>${S.tab === t ? grouped(t) : ''}</details>`).join('')}</section>
  <section class="panel step"><h3>4. Copy to server</h3><p><button class="primary" data-act="copy">Copy complete file</button> <button data-act="dl">Download</button> <button data-act="peek">Show file</button></p><pre id="peek" hidden style="max-height:300px;overflow:auto">${esc(write())}</pre></section></main></div>`;
}

const V = { A: ['A', 'In-game tabs'], B: ['B', 'Three panes, live file'], C: ['C', 'Guided: diff first'] };
let variant = new URLSearchParams(location.search).get('variant') || 'B';
function render() {
  const focus = document.activeElement?.matches?.('[data-q]'), pos = document.activeElement?.selectionStart;
  document.getElementById('app').innerHTML = { A, B, C }[variant]();
  document.getElementById('vlabel').textContent = `${V[variant][0]} (${V[variant][1]})`;
  if (focus) { const q = document.querySelector('[data-q]'); q.focus(); q.setSelectionRange(pos, pos); }
}
function go(d) { const ks = Object.keys(V); variant = ks[(ks.indexOf(variant) + d + ks.length) % ks.length]; history.replaceState(null, '', '?variant=' + variant); render(); }
document.getElementById('prev').onclick = () => go(-1); document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.k;
  if (k) { const o = BY[k]; setVal(k, o.type === 'boolean' ? t.checked : o.type === 'string' ? t.value : Number(t.value)); }
  if (t.dataset.combo && t.value !== 'Custom') setVal(t.dataset.combo, Number(t.value));
  if (t.dataset.preset !== undefined && t.value) { reset(t.value === '__def' ? null : t.value); render(); }
});
document.addEventListener('input', e => { if (e.target.dataset.q !== undefined) { S.q = e.target.value; render(); } });
document.addEventListener('toggle', e => { const d = e.target.dataset?.det; if (d && e.target.open && S.tab !== d) { S.tab = d; render(); } }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.tab) { S.tab = d.tab; S.q = ''; render(); }
  if (d.reset) resetOver(d.reset); if (d.reroll) reroll(d.reroll);
  if (d.open) document.getElementById(d.open).showModal(); if (d.close !== undefined) t.closest('dialog').close();
  if (d.act === 'load') { load(document.getElementById('pastebox').value); }
  if (d.act === 'copy') copy(); if (d.act === 'dl') download();
  if (d.act === 'peek') document.getElementById('peek').hidden ^= 1;
});
render();
